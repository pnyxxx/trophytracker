# Intégration continue : à chaque push / pull request, on vérifie que tout fonctionne.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint, tests unitaires, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  stack:
    name: Stack complète (Docker) + tests base & bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Générer un .env de test
        run: sh scripts/init-env.sh
      - name: Démarrer la stack
        run: docker compose --profile dev up -d --build --wait --wait-timeout 600
      - name: Tests de la base (sécurité RLS, ingestion GPS, MFA)
        run: sh scripts/test-db.sh
      - name: Tests de bout en bout
        run: node scripts/e2e/smoke.mjs
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose --profile dev logs --tail=200
