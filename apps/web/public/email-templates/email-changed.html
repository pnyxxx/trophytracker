<!doctype html>
<html lang="fr">
<body style="margin:0;padding:0;background:#f4efe8;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden">
        <tr><td style="background:#120F0C;padding:20px 32px;color:#F4ECDF;font-size:22px;font-weight:800;letter-spacing:.02em">
          <img src="{{ .SiteURL }}/email-logo.png" width="36" height="36" alt="" style="vertical-align:middle;margin-right:10px;border:0"><span style="vertical-align:middle">TROPHY<span style="color:#DB4740">TRACKER</span></span>
        </td></tr>
        <tr><td style="padding:32px">
          <h1 style="margin:0 0 16px;font-size:22px">Adresse email modifiée</h1>
          <p style="margin:0 0 24px;line-height:1.6;color:#444">L'adresse email de votre compte TrophyTracker a été modifiée. Elle est désormais {{ .Email }}.</p>

          <p style="margin:0;font-size:13px;line-height:1.5;color:#888">Si ce n'est pas vous, <a href="{{ .SiteURL }}/mot-de-passe-oublie" style="color:#DB4740">réinitialisez immédiatement votre mot de passe</a> et contactez l'équipe.</p>
        </td></tr>
      </table>
      <p style="font-size:12px;color:#999;margin-top:16px">Suivez les équipages du 4L Trophy en direct.</p>
    </td></tr>
  </table>
</body>
</html>
